name: ClaudeGlasses

options:
  bundleIdPrefix: com.wodnii
  deploymentTarget:
    iOS: "17.2"

packages:
  MWDAT:
    url: https://github.com/facebook/meta-wearables-dat-ios
    exactVersion: 1.0.1

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    META_APP_ID: "0"
    CLIENT_TOKEN: "0"

targets:
  ClaudeGlasses:
    type: application
    platform: iOS
    sources:
      - path: ClaudeGlasses
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wodnii.claudeglasses
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: ClaudeGlasses/Info.plist
    dependencies:
      - package: MWDAT
        product: MWDATCore
      - package: MWDAT
        product: MWDATCamera
