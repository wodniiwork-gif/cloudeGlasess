name: Build iOS app

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15-intel
    timeout-minutes: 40
    defaults:
      run:
        working-directory: ClaudeGlasses
    steps:
      - uses: actions/checkout@v4

      - name: Pick the newest Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$XCODE" ]; then sudo xcode-select -s "$XCODE"; fi
          xcodebuild -version

      - name: Generate the Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build (unsigned)
        run: |
          set -o pipefail
          xcodebuild build \
            -project ClaudeGlasses.xcodeproj \
            -scheme ClaudeGlasses \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            | tee build.log | grep -E "error:|BUILD (SUCCEEDED|FAILED)" || true
          test -d build/Build/Products/Release-iphoneos/ClaudeGlasses.app

      - name: Pack .ipa
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/ClaudeGlasses.app Payload/
          zip -qry ClaudeGlasses.ipa Payload
          ls -lh ClaudeGlasses.ipa

      - name: Upload .ipa
        uses: actions/upload-artifact@v4
        with:
          name: ClaudeGlasses-ipa
          path: ClaudeGlasses/ClaudeGlasses.ipa

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: ClaudeGlasses/build.log
